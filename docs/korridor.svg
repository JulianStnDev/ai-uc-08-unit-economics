<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Preiskorridor je Kundentyp in EUR je Monat, mit Intercom Fin als Vergleich">
<style>:root{--bg:#fcfcfb;--t1:#0b0b0b;--t2:#52514e;--grid:#e6e5e1;--band:#2a78d6;--fin:#eb6834;}@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--t1:#ffffff;--t2:#c3c2b7;--grid:#34332f;--band:#3987e5;--fin:#d95926;}} text{fill:var(--t2);font-size:12px} .t1{fill:var(--t1)}</style>
