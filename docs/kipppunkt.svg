<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Ersparnis je Ticket über der Übergabequote, drei Szenarien">
<style>:root{--bg:#fcfcfb;--t1:#0b0b0b;--t2:#52514e;--grid:#e6e5e1;--zero:#8a8984;--optimistisch:#2a78d6;--mittel:#eb6834;--pessimistisch:#1baf7a;}@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--t1:#ffffff;--t2:#c3c2b7;--grid:#34332f;--zero:#8a8984;--optimistisch:#3987e5;--mittel:#d95926;--pessimistisch:#199e70;}} text{fill:var(--t2);font-size:12px} .t1{fill:var(--t1)}</style>
