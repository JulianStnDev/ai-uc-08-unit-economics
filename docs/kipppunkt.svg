<text x="70" y="26" class="t1" font-size="16" font-weight="600">Ersparnis je Ticket gegenüber Mensch allein</text>
<text x="70" y="46">EUR je Ticket bei 10.000 Tickets im Monat. Unter 0 ist der Agent teurer. Mensch allein: 8 min × 0,442 EUR/min</text>
